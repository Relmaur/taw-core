name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer:v2
          coverage: none

      - name: Validate composer.json
        run: composer validate --no-check-all --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHP lint (php -l on every file)
        run: |
          find . -name "*.php" \
            -not -path "./vendor/*" \
            -not -path "./node_modules/*" \
            -print0 | xargs -0 -n1 -P4 php -l

      - name: PHPStan static analysis
        run: composer run phpstan

      - name: PHPUnit unit tests
        run: composer run test

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Shared Vite config tests (node:test, no npm deps)
        run: node --test tests/js/*.test.mjs

  data-panel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: resources/data-panel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: resources/data-panel/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Lint, format, typecheck, Vitest, build
        run: npm run check

      # The build is committed (ADR-0007): a fresh one must match it exactly.
      - name: Committed build is current
        working-directory: .
        run: |
          git status --porcelain -- assets/data-panel
          test -z "$(git status --porcelain -- assets/data-panel)" || { echo "assets/data-panel is stale: run npm run build in resources/data-panel and commit it."; exit 1; }
